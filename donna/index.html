<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Donna</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b1020; }
  .photo { position: fixed; inset: 0; background: url("/donna/photo.jpg") center 18% / cover no-repeat; }
  .shade { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 68%, rgba(0,0,0,.92) 100%); }
  main { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); text-align: center; color: #fff; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 32px; margin: 0 0 2px; }
  p { margin: 0 0 10px; color: rgba(255,255,255,.88); }
  a { color: #fff; font-size: 15px; }
  small { display: block; max-width: 360px; margin: 12px auto 0; color: rgba(255,255,255,.72); font-size: 11px; line-height: 1.45; }
  small a { font-size: 11px; color: inherit; }
</style>
</head>
<body>
<div class="photo" role="img" aria-label="Sarah Rafferty"></div>
<div class="shade"></div>
<main>
  <h1>Donna</h1>
  <p>A private iPhone assistant. Not available to the public.</p>
  <a href="/donna/privacy/">Privacy policy</a>
  <small>Photo of Sarah Rafferty by Genevieve, <a href="https://commons.wikimedia.org/wiki/File:Sarah_Rafferty_in_January_2013_(cropped).jpg">via Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a>, resized. She is not affiliated with this app.</small>
</main>
</body>
</html>
